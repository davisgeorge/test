[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "An always-on bot, with a web app, that collects the job openings in a country from public job APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.setuptools.package-data]
"jobbot.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
